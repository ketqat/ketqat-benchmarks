[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ketqat-benchmarks"
version = "0.1.0"
description = "Benchmark suites, decoder comparisons, fixtures and importers for KetQat."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Heavy scientific dependencies live here, never in ketqat-sdk's core.
decoders = [
  "stim>=1.14",
  "sinter>=1.14",
  "pymatching>=2.2",
  "beliefmatching>=0.1",
  # Every published tesseract-decoder is a pre-release (0.1.1.devNNNNNNNN); there has never
  # been a stable one. `>=0.1` therefore resolves to nothing on pip 25 and earlier, which
  # excludes pre-releases from a specifier that does not mention one. Newer pip falls back
  # to pre-releases when no stable version exists, which is why this was invisible: the
  # editable install worked on machines that already had it, and the first clean install on
  # a runner failed outright. A dev-segment specifier is the accurate statement.
  "tesseract-decoder>=0.1.1.dev0",
  "numpy>=1.24",
]

[project.scripts]
# The gate belongs in the install, not beside it. It lived in scripts/ and so was absent
# from the wheel: a clean-room user could produce a comparison and had no way to check it.
ketqat-benchmarks-gate = "ketqat_benchmarks.gate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ketqat_benchmarks"]

# The suites, the results and the citation file go *into* the wheel (#6). Publishing
# suites so they can be cited at a version, rather than by SDK commit, is the reason this
# repository exists; a wheel carrying only the harness does not deliver it. They are placed
# under the package directory so installing this does not put `suites/` and `results/` at
# the top level of site-packages.
[tool.hatch.build.targets.wheel.force-include]
"suites" = "ketqat_benchmarks/suites"
"results" = "ketqat_benchmarks/results"
"CITATION.cff" = "ketqat_benchmarks/CITATION.cff"
